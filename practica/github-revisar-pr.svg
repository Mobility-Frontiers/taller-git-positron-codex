<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Revisar y hacer merge de un pull request en GitHub</title>
  <desc>Captura ilustrativa de un pull request en GitHub mostrando la pestaña Files changed con el diff de notas.md, un comentario de revisión, la aprobación, y el botón Merge pull request habilitado tras la aprobación.</desc>

  <rect x="0" y="0" width="900" height="440" fill="#ffffff" stroke="#d0d7de"/>

  <rect x="0" y="0" width="900" height="46" fill="#f6f8fa"/>
  <rect x="0" y="45" width="900" height="1" fill="#d0d7de"/>
  <text x="20" y="28" fill="#24292f" font-size="15" font-weight="600">docs: agrega nota de práctica de Roberto #1</text>

  <g font-size="13">
    <text x="20" y="66" fill="#57606a">Conversation</text>
    <text x="130" y="66" fill="#24292f" font-weight="600">Files changed</text>
    <rect x="130" y="72" width="90" height="2" fill="#fd8c73"/>
    <rect x="230" y="56" width="18" height="18" rx="9" fill="#eaeef2"/>
    <text x="239" y="69" fill="#57606a" font-size="11" text-anchor="middle">1</text>
  </g>

  <rect x="20" y="90" width="860" height="1" fill="#d0d7de"/>

  <rect x="20" y="106" width="860" height="26" fill="#f6f8fa"/>
  <text x="32" y="124" fill="#24292f" font-size="12">practica/notas.md</text>

  <rect x="20" y="132" width="860" height="20" fill="#e6ffec"/>
  <text x="34" y="147" fill="#116329" font-size="12">+ - Roberto, 28 de julio de 2026</text>

  <rect x="20" y="170" width="860" height="60" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="40" cy="192" r="10" fill="#ddf4ff"/>
  <text x="40" y="196" fill="#0969da" font-size="10" text-anchor="middle">C</text>
  <text x="58" y="190" fill="#24292f" font-size="12" font-weight="600">camila comentó</text>
  <text x="58" y="210" fill="#57606a" font-size="12">Todo bien, el formato de la línea sigue la convención. Aprobado.</text>

  <rect x="20" y="248" width="860" height="1" fill="#d0d7de"/>

  <rect x="20" y="264" width="200" height="30" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="32" y="284" fill="#116329" font-size="12">✓ camila aprobó estos cambios</text>

  <rect x="20" y="312" width="860" height="60" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="32" y="332" fill="#116329" font-size="12" font-weight="600">✓ All checks have passed</text>
  <text x="32" y="352" fill="#116329" font-size="12">This branch has no conflicts with the base branch</text>

  <rect x="20" y="388" width="200" height="36" rx="6" fill="#1f883d"/>
  <text x="120" y="411" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Merge pull request</text>
</svg>
