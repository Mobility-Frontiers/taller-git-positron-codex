<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Revisar y hacer merge de un pull request desde Positron</title>
  <desc>Captura ilustrativa de la vista Description de un pull request dentro de Positron, con el botón Checkout, un comentario de otra persona del grupo, y los botones Approve y Merge Pull Request.</desc>

  <rect x="0" y="0" width="900" height="460" rx="8" fill="#1e1e1e"/>

  <text x="20" y="30" fill="#e8e8e8" font-size="14" font-weight="600">docs: agrega nota de práctica de Roberto #1</text>
  <text x="20" y="50" fill="#8a8a8a" font-size="12">roberto/practica-taller → main</text>

  <rect x="700" y="16" width="90" height="28" rx="4" fill="#3c3c3c"/>
  <text x="745" y="34" fill="#cccccc" font-size="12" text-anchor="middle">Checkout</text>

  <rect x="0" y="64" width="900" height="1" fill="#3c3c3c"/>

  <rect x="20" y="82" width="860" height="26" fill="#252526"/>
  <text x="32" y="100" fill="#cccccc" font-size="12">practica/notas.md</text>

  <rect x="20" y="108" width="860" height="20" fill="#2b3a2b"/>
  <text x="34" y="122" fill="#89d185" font-size="12">+ - Roberto, 28 de julio de 2026</text>

  <rect x="20" y="150" width="860" height="70" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <circle cx="42" cy="176" r="11" fill="#04395e"/>
  <text x="42" y="180" fill="#6ab0f3" font-size="10" text-anchor="middle">E</text>
  <text x="62" y="172" fill="#e8e8e8" font-size="12" font-weight="600">elisa comentó</text>
  <text x="62" y="192" fill="#cccccc" font-size="12">Todo bien, el formato de la línea sigue la convención. Aprobado.</text>

  <rect x="20" y="240" width="860" height="1" fill="#3c3c3c"/>

  <rect x="20" y="256" width="90" height="30" rx="4" fill="#238636"/>
  <text x="65" y="276" fill="#ffffff" font-size="12" text-anchor="middle">Approve</text>
  <text x="120" y="276" fill="#8a8a8a" font-size="12">elisa aprobó estos cambios</text>

  <rect x="20" y="300" width="860" height="50" rx="4" fill="#1b2d1b" stroke="#2ea043"/>
  <text x="34" y="322" fill="#7ee787" font-size="12" font-weight="600">✓ All checks have passed</text>
  <text x="34" y="340" fill="#7ee787" font-size="11">This branch has no conflicts with the base branch</text>

  <rect x="20" y="372" width="200" height="36" rx="4" fill="#238636"/>
  <text x="120" y="395" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Merge Pull Request</text>

  <text x="20" y="432" fill="#8a8a8a" font-size="11">Después del merge, Positron ofrece borrar la rama remota y la local.</text>
</svg>
