<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Clonar el repositorio de práctica desde Positron</title>
  <desc>Captura ilustrativa de Positron mostrando la paleta de comandos con Git Clone seleccionado, el cuadro para pegar la URL del repositorio, y el selector de carpeta local de destino.</desc>

  <rect x="0" y="0" width="900" height="420" rx="8" fill="#1e1e1e"/>

  <rect x="150" y="20" width="600" height="38" rx="6" fill="#3c3c3c" stroke="#0e639c"/>
  <text x="164" y="44" fill="#e8e8e8" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">&gt;Git: Clone</text>

  <rect x="150" y="60" width="600" height="34" fill="#37373d"/>
  <text x="164" y="82" fill="#cccccc" font-size="12">Clone from GitHub</text>
  <rect x="150" y="94" width="600" height="34" fill="#2a2d2e"/>
  <text x="164" y="116" fill="#cccccc" font-size="12">Clone from URL</text>

  <text x="20" y="160" fill="#8a8a8a" font-size="12">Paso 1 — Pegar la URL del repositorio de práctica:</text>
  <rect x="20" y="172" width="860" height="34" rx="4" fill="#3c3c3c" stroke="#0e639c"/>
  <text x="32" y="194" fill="#e8e8e8" font-size="13" font-family="'SFMono-Regular', Consolas, monospace">https://github.com/Mobility-Frontiers/taller-git-positron-codex.git</text>

  <text x="20" y="240" fill="#8a8a8a" font-size="12">Paso 2 — Elegir la carpeta local donde se va a guardar el repositorio:</text>
  <rect x="20" y="252" width="860" height="90" rx="4" fill="#252526" stroke="#3c3c3c"/>
  <text x="36" y="276" fill="#cccccc" font-size="12">📁 Documents</text>
  <text x="52" y="298" fill="#569cd6" font-size="12">📁 Repositories</text>
  <rect x="36" y="306" width="300" height="20" fill="#04395e"/>
  <text x="68" y="320" fill="#ffffff" font-size="12">📁 taller-git-positron-codex</text>

  <rect x="700" y="360" width="160" height="34" rx="4" fill="#0e639c"/>
  <text x="780" y="382" fill="#ffffff" font-size="13" text-anchor="middle">Select as Repository Destination</text>

  <text x="20" y="392" fill="#8a8a8a" font-size="11">Al terminar, Positron pregunta si se quiere abrir el repositorio clonado — elegir "Open".</text>
</svg>
