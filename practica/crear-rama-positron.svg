<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'SFMono-Regular', Consolas, Menlo, monospace" role="img">
  <title>Crear una rama personal desde Positron</title>
  <desc>Captura ilustrativa de Positron mostrando el clic en el nombre de la rama en la barra de estado inferior, el listado desplegable con la opción Create new branch, y el cuadro de texto donde se escribe el nombre roberto barra practica-taller siguiendo la convención del grupo.</desc>

  <rect x="0" y="0" width="900" height="420" rx="8" fill="#1e1e1e"/>

  <rect x="0" y="0" width="900" height="34" rx="8" fill="#252526"/>
  <rect x="0" y="20" width="900" height="14" fill="#252526"/>
  <text x="16" y="22" fill="#cccccc" font-size="12">practica/notas.md</text>

  <g font-size="13">
    <text x="16" y="60" fill="#5a5a5a" text-anchor="end">1</text>
    <text x="34" y="60" fill="#6a9955"># Notas de práctica</text>
    <text x="16" y="82" fill="#5a5a5a" text-anchor="end">2</text>
    <text x="34" y="82" fill="#d4d4d4">...</text>
  </g>

  <rect x="200" y="150" width="500" height="180" rx="6" fill="#252526" stroke="#454545"/>
  <rect x="200" y="150" width="500" height="34" rx="6" fill="#3c3c3c"/>
  <text x="216" y="172" fill="#cccccc" font-size="13">Seleccionar una rama para cambiar, o crear una rama nueva</text>

  <rect x="208" y="192" width="484" height="30" fill="#0e639c"/>
  <text x="222" y="211" fill="#ffffff" font-size="13">+ Crear nueva rama...</text>

  <text x="222" y="240" fill="#9d9d9d" font-size="12">ramas locales</text>
  <text x="222" y="260" fill="#d4d4d4" font-size="13">⎇ main</text>

  <rect x="200" y="330" width="500" height="40" rx="6" fill="#3c3c3c" stroke="#0e639c" stroke-width="1.5"/>
  <text x="216" y="354" fill="#ffffff" font-size="13">roberto/practica-taller</text>
  <rect x="640" y="340" width="1" height="20" fill="#ffffff"/>

  <text x="200" y="392" fill="#8a8a8a" font-size="11">nombre de rama siguiendo la convención: tu-nombre/descripción-corta</text>

  <rect x="0" y="386" width="900" height="34" fill="#007acc"/>
  <text x="16" y="408" fill="#ffffff" font-size="12">⎇ main</text>
  <text x="70" y="408" fill="#ffffff" font-size="12" opacity="0.7">← clic aquí para cambiar o crear una rama</text>
</svg>
