<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Menú de cuenta de GitHub en Positron, ya conectado</title>
  <desc>Captura ilustrativa del menú que se despliega al hacer clic en el ícono de cuenta de Positron, mostrando la cuenta rcantillan GitHub con un submenú que incluye Manage Trusted Extensions, Manage Trusted MCP Servers y Sign Out, además de las opciones Configure Language Model Providers, Manage Extension Account Preferences y Manage Language Model Access.</desc>

  <rect x="0" y="0" width="700" height="300" fill="#1e1e1e"/>

  <rect x="0" y="0" width="48" height="300" fill="#333333"/>
  <circle cx="24" cy="240" r="13" fill="#3c3c3c" stroke="#6a6a6a"/>
  <text x="24" y="245" fill="#cccccc" font-size="13" text-anchor="middle">◐</text>
  <text x="24" y="270" fill="#cccccc" font-size="14" text-anchor="middle">⚙</text>

  <rect x="66" y="60" width="230" height="120" rx="4" fill="#2b2d2e" stroke="#454545"/>

  <rect x="66" y="60" width="230" height="30" fill="#04395e"/>
  <text x="78" y="80" fill="#e8e8e8" font-size="12">rcantillan (GitHub)</text>
  <text x="272" y="80" fill="#cccccc" font-size="11">›</text>

  <rect x="66" y="90" width="230" height="1" fill="#454545"/>
  <text x="78" y="112" fill="#cccccc" font-size="12">Configure Language Model Providers</text>
  <rect x="66" y="122" width="230" height="1" fill="#454545"/>
  <text x="78" y="142" fill="#cccccc" font-size="12">Manage Extension Account</text>
  <text x="78" y="158" fill="#cccccc" font-size="12">Preferences...</text>
  <text x="78" y="176" fill="#cccccc" font-size="12">Manage Language Model Access...</text>

  <rect x="296" y="60" width="230" height="86" rx="4" fill="#2b2d2e" stroke="#454545"/>
  <text x="308" y="82" fill="#e8e8e8" font-size="12">Manage Trusted Extensions</text>
  <text x="308" y="108" fill="#e8e8e8" font-size="12">Manage Trusted MCP Servers</text>
  <text x="308" y="134" fill="#e8e8e8" font-size="12">Sign Out</text>

  <rect x="0" y="278" width="700" height="22" fill="#007acc"/>
  <text x="8" y="293" fill="#ffffff" font-size="11">⎇ main*   ↻   0↓ 3↑     ⊗ 0  ⚠ 0     Quarto: 1.9.38</text>

  <text x="66" y="212" fill="#8a8a8a" font-size="11">Este menú aparece con la cuenta ya conectada. Antes de conectar,</text>
  <text x="66" y="228" fill="#8a8a8a" font-size="11">en ese mismo lugar aparece la opción "Sign in with GitHub".</text>
</svg>
