<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Conectar la cuenta de GitHub desde Positron</title>
  <desc>Captura ilustrativa de Positron mostrando la barra de actividad izquierda con el ícono de cuenta en la esquina inferior, el menú desplegado con la opción Sign in with GitHub to use Git and GitHub features, y el botón Allow para autorizar el acceso.</desc>

  <rect x="0" y="0" width="900" height="420" rx="8" fill="#1e1e1e"/>

  <rect x="0" y="0" width="48" height="420" fill="#333333"/>
  <rect x="8" y="16" width="32" height="32" rx="6" fill="#0e639c"/>
  <rect x="8" y="56" width="32" height="32" rx="6" fill="#3c3c3c"/>
  <rect x="8" y="96" width="32" height="32" rx="6" fill="#3c3c3c"/>
  <circle cx="24" cy="388" r="15" fill="#3c3c3c" stroke="#6a6a6a"/>
  <text x="24" y="393" fill="#cccccc" font-size="14" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">◐</text>

  <rect x="48" y="330" width="320" height="86" rx="6" fill="#2d2d2d" stroke="#454545"/>
  <text x="64" y="352" fill="#e8e8e8" font-size="13" font-weight="600">Roberto</text>
  <rect x="48" y="360" width="320" height="1" fill="#454545"/>
  <text x="64" y="382" fill="#cccccc" font-size="12">Sign in with GitHub to use Git and</text>
  <text x="64" y="398" fill="#cccccc" font-size="12">GitHub features</text>

  <rect x="330" y="0" width="570" height="420" fill="#1e1e1e"/>
  <rect x="360" y="60" width="480" height="200" rx="8" fill="#252526" stroke="#3c3c3c"/>

  <circle cx="600" cy="106" r="20" fill="#3c3c3c"/>
  <text x="600" y="113" fill="#e8e8e8" font-size="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">⎇</text>

  <text x="600" y="146" fill="#e8e8e8" font-size="14" text-anchor="middle" font-weight="600">Positron quiere iniciar sesión con GitHub</text>
  <text x="600" y="166" fill="#9d9d9d" font-size="12" text-anchor="middle">Esto conecta tu cuenta personal con Positron para</text>
  <text x="600" y="182" fill="#9d9d9d" font-size="12" text-anchor="middle">clonar y sincronizar los repos del grupo.</text>

  <rect x="490" y="202" width="220" height="30" rx="4" fill="#0e639c"/>
  <text x="600" y="222" fill="#ffffff" font-size="13" text-anchor="middle">Allow</text>

  <text x="360" y="286" fill="#6a6a6a" font-size="11">Al aceptar, se abre el navegador y se confirma un código de un solo uso.</text>
</svg>
